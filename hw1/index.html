<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошик покупок</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <main class="container">
        <section class="left-col">
            <form id="add-form" class="add-item-box">
                <input type="text" id="item-input" placeholder="Назва товару" aria-label="Назва товару" class="input-field" required autocomplete="off">
                <button type="submit" class="btn btn-primary" data-tooltip="Додати товар до списку">Додати</button>
            </form>

            <div id="products-container" class="products-list"></div>
        </section>

        <aside class="right-col">
            <div class="stats-card">
                <h2>Залишилося</h2>
                <div id="remaining-container" class="stats-list"></div>
                
                <hr class="divider">
                
                <h2>Куплено</h2>
                <div id="bought-container" class="stats-list crossed-out"></div>
            </div>
        </aside>
    </main>

    <div class="author-badge">
        <div class="badge-hidden-text">Роботу виконала Самойлич Софія</div>
        <div class="badge-visible-text">BuyList</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
